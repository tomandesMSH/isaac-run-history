<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#140e0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Statistics for your The Binding of Isaac: Repentance+ runs, from the Isaac Run History mod. Runs stay in your browser." />
    <title>Isaac Run History</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%23f1d9c3' stroke='%23331f1a' stroke-width='2'/%3E%3Ccircle cx='11' cy='15' r='2.5' fill='%23331f1a'/%3E%3Ccircle cx='21' cy='15' r='2.5' fill='%23331f1a'/%3E%3Cpath d='M10 19q1 6 1 9M22 19q-1 6-1 9' stroke='%235aa9e6' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body class="no-data">
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/stats"><span class="brand-red">Isaac</span> Run History</a>
      <nav class="nav" aria-label="Pages">
        <a href="#/stats" data-route="stats">Statistics</a>
        <a href="#/runs" data-route="runs">Runs</a>
        <a href="#/lifetime" data-route="lifetime">Lifetime</a>
      </nav>
      <div class="actions">
        <span id="run-count" class="muted small"></span>
        <button id="btn-import" class="btn btn-primary" type="button">Import file</button>
        <button id="btn-paste" class="btn" type="button">Paste</button>
        <button id="btn-folder" class="btn" type="button" hidden>Connect folder</button>
        <details class="menu music-menu" id="music-menu" hidden>
          <summary class="btn btn-icon" aria-label="Music"></summary>
          <div class="menu-list music-panel" id="music-panel"></div>
        </details>
        <details class="menu bg-menu" id="bg-menu">
          <summary class="btn">Background</summary>
          <div class="menu-list bg-list" id="bg-list" role="group" aria-label="Background floor"></div>
        </details>
        <details class="menu more-menu">
          <summary class="btn" aria-label="More">⋯</summary>
          <div class="menu-list">
            <button id="btn-forget-folder" class="menu-item" type="button" hidden>Disconnect history folder</button>
            <button id="btn-download" class="menu-item" type="button">Download all runs (JSON)</button>
            <button id="btn-clear" class="menu-item menu-danger" type="button">Remove all runs from this browser</button>
          </div>
        </details>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <div class="room-wall" aria-hidden="true">
      <span class="room-water"></span>
      <span class="room-shade"></span>
      <div class="room-details"></div>
      <span class="door door-left"></span><span class="door door-right"></span>
      <span class="deco deco-tl"></span><span class="deco deco-tr"></span><span class="deco deco-bl"></span><span class="deco deco-br"></span>
    </div>
    <div id="drop-overlay" class="drop-overlay" hidden><div>Drop to import</div></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
